[package]
name = "standard-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false
description = "Longfellow (Google Benchmark) prove-verify benchmarks for the credential presentation proof"

[lib]
name = "standard"
path = "scripts/lib.rs"

[[bin]]
name = "bench_prove_verify"
path = "prove-verify/bench_prove_verify.rs"

[[bin]]
name = "bench_prove_verify_no_cft"
path = "prove-verify-no-cft/bench_prove_verify_no_cft.rs"

[[bin]]
name = "bench_prove_verify_revocation"
path = "prove-verify-revocation/bench_prove_verify_revocation.rs"

[[bin]]
name = "bench_merkle_vs_flat"
path = "merkle-vs-flat/bench_merkle_vs_flat.rs"

[[bin]]
name = "bench_communication_size"
path = "communication-costs/bench_communication_size.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
