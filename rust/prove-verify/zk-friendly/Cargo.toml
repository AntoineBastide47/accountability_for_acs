[package]
name = "zk-friendly-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false
description = "Circom / Groth16 prove-verify benchmarks for the credential presentation proof"

[lib]
name = "zk_friendly"
path = "lib/lib.rs"

[[bin]]
name = "bench_prove_verify"
path = "prove-verify/bench_prove_verify.rs"

[[bin]]
name = "bench_prove_verify_no_cft"
path = "prove-verify-no-cft/bench_prove_verify_no_cft.rs"

[[bin]]
name = "bench_prove_verify_revocation"
path = "prove-verify-revocation/bench_prove_verify_revocation.rs"

[[bin]]
name = "bench_merkle_vs_flat"
path = "merkle-vs-flat/bench_merkle_vs_flat.rs"

[[bin]]
name = "bench_communication_size"
path = "communication-costs/bench_communication_size.rs"

[dependencies]
anyhow = "1"
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ed-on-bn254 = "0.5"
ark-ff = "0.5"
ark-std = "0.5"
clap = { version = "4", features = ["derive", "env"] }
light-poseidon = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
