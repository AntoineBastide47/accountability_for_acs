[package]
name = "revocation-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Baby Jubjub CFT anonymity-revocation benchmarks"

[lib]
name = "revocation"
path = "lib/lib.rs"

[[bin]]
name = "bench_direct_decrypt"
path = "direct-decrypt/bench_direct_decrypt.rs"

[[bin]]
name = "bench_link_decrypt"
path = "link-decrypt/bench_link_decrypt.rs"

[[bin]]
name = "verify_link"
path = "link-decrypt/verify_link.rs"

[[bin]]
name = "run_experiments"
path = "lib/run_experiments.rs"

[[bin]]
name = "bench_mpc"
path = "mpc/bench_mpc.rs"

[[bin]]
name = "pet_mpc"
path = "mpc/pet_mpc.rs"

[[bin]]
name = "regenerate_from_runs"
path = "scripts/regenerate_from_runs.rs"

[dependencies]
anyhow = "1"
ark-ec = "0.5"
ark-ed-on-bn254 = "0.5"
ark-ff = "0.5"
ark-std = "0.5"
light-poseidon = "0.4"
rand = "0.8"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
